spring.application.name=ApiGateway

server.port=8081

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.service-url.default-zone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.cloud.gateway.routes[0].id=Authentication-Microservice
spring.cloud.gateway.routes[0].uri=lb://AUTHENTICATION-MICROSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=Train-Microservice
spring.cloud.gateway.routes[1].uri=lb://TRAIN-MICROSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/fare/**

spring.cloud.gateway.routes[2].id=Train-Microservice
spring.cloud.gateway.routes[2].uri=lb://Train-Microservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/train/**

spring.cloud.gateway.routes[3].id=Train-Microservice
spring.cloud.gateway.routes[3].uri=lb://Train-Microservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/seat/**

spring.cloud.gateway.routes[4].id=Train-Microservice
spring.cloud.gateway.routes[4].uri=lb://Train-Microservice
spring.cloud.gateway.routes[4].predicates[0]=Path=/coach/**

spring.cloud.gateway.routes[5].id=Reservation-Service
spring.cloud.gateway.routes[5].uri=lb://Reservation-Service
spring.cloud.gateway.routes[5].predicates[0]=Path=/booking/**

spring.cloud.gateway.routes[6].id=PaymentGateway
spring.cloud.gateway.routes[6].uri=lb://PaymentGateway
spring.cloud.gateway.routes[6].predicates[0]=Path=/booking/**