<div class="register-container" style="
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #fffde4 0%, #f9f9f9 100%);
  font-family: 'Poppins', sans-serif;
">
  <form class="register-form" (ngSubmit)="register()" style="
    background: rgba(255, 255, 255, 0.95);
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 400px;
    text-align: center;
  ">
    <h2 style="margin-bottom: 20px; color: #444;">📝 Register</h2>

    <input [(ngModel)]="user.username" name="username" placeholder="Username" required style="
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      transition: border-color 0.3s ease;
    " onfocus="this.style.borderColor='#ffc107'" onblur="this.style.borderColor='#ddd'" />

    <input [(ngModel)]="user.password" name="password" type="password" placeholder="Password" required style="
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      transition: border-color 0.3s ease;
    " onfocus="this.style.borderColor='#ffc107'" onblur="this.style.borderColor='#ddd'" />

    <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" required style="
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      transition: border-color 0.3s ease;
    " onfocus="this.style.borderColor='#ffc107'" onblur="this.style.borderColor='#ddd'" />

    <button type="submit" style="
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ffe57f, #ffd54f);
      color: #333;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    " onmouseover="this.style.background='linear-gradient(135deg, #ffd54f, #ffe57f)'" onmouseout="this.style.background='linear-gradient(135deg, #ffe57f, #ffd54f)'">
      Register
    </button>

    <p *ngIf="passwordMismatch" style="color: #e53935; font-size: 14px; margin-top: 10px;">
      Passwords do not match.
    </p>

    <p style="margin-top: 20px; font-size: 14px; color: #555;">
      Already have an account?
      <a routerLink="/login" style="color: #007bff; text-decoration: underline; cursor: pointer;">Sign In</a>
    </p>
  </form>
</div>
