<div style="height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea, #764ba2);">
  <div class="login-container" style="width: 400px; padding: 30px; background-color: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); font-family: 'Segoe UI', sans-serif;">
    
    <form class="login-form" (ngSubmit)="login()" style="display: flex; flex-direction: column; gap: 16px;">
      <h2 style="text-align: center; color: #333; font-size: 26px; margin-bottom: 10px;">Welcome Back</h2>
      <p style="text-align: center; color: #666; font-size: 14px;">Please login to continue</p>

      <input [(ngModel)]="username" name="username" placeholder="Username" required
             style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" />

      <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required
             style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;" />

      <button type="submit"
              style="padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">
        🔐 Login
      </button>

      <p *ngIf="error" class="error" style="color: red; text-align: center; font-size: 13px;">{{ error }}</p>

      <p style="text-align: center; font-size: 14px; margin-top: 10px;">New user?
        <a (click)="goToRegister()" style="color: #007bff; cursor: pointer; text-decoration: underline;">Register Now</a>
      </p>
    </form>
  </div>
</div>
