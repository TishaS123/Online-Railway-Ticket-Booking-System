<div style="height: 100vh; display: flex; justify-content: center; align-items: center; background: #f4f6f8;">
  <div style="max-width: 440px; width: 100%; padding: 30px; border-radius: 20px; background: linear-gradient(135deg, #aab6f5, #c3b7f2); box-shadow: 0 8px 20px rgba(0,0,0,0.1); font-family: 'Segoe UI', sans-serif; color: #2c3e50;">
    <h2 style="text-align: center; margin-bottom: 25px;">
      <i class="fa fa-credit-card"></i> Payment Info
    </h2>

    <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 18px;">
        <label style="font-weight: 600;">Cardholder Name</label>
        <input formControlName="cardName" placeholder="John Doe"
               style="width: 400px; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 10px; background: #fff; color: #2c3e50;" />
        <small *ngIf="paymentForm.get('cardName')?.invalid && (paymentForm.get('cardName')?.touched || paymentForm.get('cardName')?.dirty)"
               style="color: #c0392b;">Name is required.</small>
      </div>

      <div style="margin-bottom: 18px;">
        <label style="font-weight: 600;">Card Number</label>
        <input formControlName="cardNumber" (input)="formatCardNumber($event)" placeholder="1234 5678 9012 3456"
               style="width: 400px; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 10px; background: #fff; color: #2c3e50;" />
        <small *ngIf="paymentForm.get('cardNumber')?.invalid && (paymentForm.get('cardNumber')?.touched || paymentForm.get('cardNumber')?.dirty)"
               style="color: #c0392b;">Enter a valid 16-digit card number.</small>
      </div>

      <div style="display: flex; gap: 20px; margin-bottom: 18px;">
        <div style="flex: 1;">
          <label style="font-weight: 600;">Expiry (MM/YY)</label>
          <input formControlName="expiry" placeholder="MM/YY"
                style="width: 160px; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 10px; background: #fff; color: #2c3e50;" />
          <small *ngIf="paymentForm.get('expiry')?.invalid && (paymentForm.get('expiry')?.touched || paymentForm.get('expiry')?.dirty)"
                style="color: #c0392b;">Enter a valid expiry date.</small>
        </div>

        <div style="flex: 1;">
          <label style="font-weight: 600;">CVV</label>
          <input formControlName="cvv" maxlength="3" placeholder="123"
                style="width: 160px; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 10px; background: #fff; color: #2c3e50;" />
          <small *ngIf="paymentForm.get('cvv')?.invalid && (paymentForm.get('cvv')?.touched || paymentForm.get('cvv')?.dirty)"
                style="color: #c0392b;">Enter a valid 3-digit CVV.</small>
        </div>
      </div>


      <button type="submit"
              style="width: 100%; padding: 14px; background: linear-gradient(135deg, #7fdbda, #6a89cc); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;">
        <i class="fa fa-lock" style="margin-right: 6px;"></i> Pay ₹ {{ticket.totalAmount}}
      </button>
    </form>
  </div>
</div>
